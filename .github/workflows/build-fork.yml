name: Build-Fork-Image

# Publishes the node image for this fork.
#
# docker-build-dev.yml does fire on main, but it pushes to
# ghcr.io/pasarguard/<repo> and docker.io — the upstream org, which a fork has
# no write access to, using Docker Hub secrets a fork does not have. So every
# run of it fails here and nothing on main ever produced an image.
#
# Separate file rather than a patch to that one, so merging upstream stays a
# clean merge. GHCR only, image path lowercased because this owner has capitals
# and GHCR rejects them.

on:
    push:
        # Feature branches build too, so a change can be tried on a test box by
        # its branch tag before it goes anywhere near main. Only main moves the
        # :main/:latest tags production pulls.
        branches: [main, "feat/**", "fix/**"]
    workflow_dispatch:

permissions:
    contents: read
    packages: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Compute image name
              id: meta
              run: |
                  image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
                  sha="$(echo '${{ github.sha }}' | cut -c1-7)"
                  reftag="$(echo '${{ github.ref_name }}' | tr '/' '-')"
                  echo "image=$image" >> "$GITHUB_OUTPUT"
                  echo "sha=$sha" >> "$GITHUB_OUTPUT"
                  {
                    echo 'tags<<EOF'
                    echo "$image:$sha"
                    echo "$image:$reftag"
                    if [ '${{ github.ref_name }}' = 'main' ]; then
                      echo "$image:latest"
                    fi
                    echo 'EOF'
                  } >> "$GITHUB_OUTPUT"

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  # Without these an image on the registry cannot be traced back
                  # to a commit, which matters while nodes are being upgraded one
                  # at a time and the reported node version does not distinguish
                  # this build from upstream's.
                  labels: |
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
