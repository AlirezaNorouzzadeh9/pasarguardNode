syntax = "proto3";

package service;

option go_package = "github.com/pasarguard/node/common";

message Empty {}

// Base info response message
message BaseInfoResponse {
  bool started = 1;
  string core_version = 2;
  string node_version = 3;
}

enum BackendType {
  XRAY = 0;
  WIREGUARD = 1;
  OPENVPN = 2;
  SINGBOX = 3;
  // 4 was L2TP before the ikev2/l2tp drop and stayed unused since, so the
  // restored backend takes its old number back.
  L2TP = 4;
}

message Backend {
  BackendType type = 1;
  string config = 2;
  repeated User users = 3;
  uint64 keep_alive = 4;
  repeated string exclude_inbounds = 5;
  // Set when the panel is adding another core to a node it is already
  // connected to, rather than connecting to it. A plain Start resets the node
  // and replaces whatever it was running; an additive one leaves the cores
  // that are already up alone.
  bool additive = 6;
}

// log
message Log {
    string detail = 1;
}

// stats
message Stat {
  string name = 1;
  string type = 2;
  string link = 3;
  int64 value = 4;
}

message StatResponse {
  repeated Stat stats = 1;
}

enum StatType {
  Outbounds = 0;
  Outbound = 1;
  Inbounds = 2;
  Inbound = 3;
  UsersStat = 4;
  UserStat = 5;
}

message StatRequest {
  string name = 1;
  bool reset = 2;
  StatType type = 3;
}

message OnlineStatResponse {
  string name = 1;
  int64 value = 2;
}

message StatsOnlineIpListResponse {
  string name = 1;
  map<string, int64> ips = 2;
}

message Latency {
  string name = 1;
  bool alive = 2;
  int64 delay = 3;
  string link = 4;
  int64 last_seen_time = 5;
  int64 last_try_time = 6;
  string source = 7;
}

message LatencyRequest {
  string name = 1;
}

message LatencyResponse {
  repeated Latency latencies = 1;
}

message BackendStatsResponse {
    uint32 num_goroutine = 1;
    uint32 num_gc = 2;
    uint64 alloc = 3;
    uint64 total_alloc = 4;
    uint64 sys = 5;
    uint64 mallocs = 6;
    uint64 frees = 7;
    uint64 live_objects = 8;
    uint64 pause_total_ns = 9;
    uint32 uptime = 10;
}

message SystemStatsResponse {
    uint64 mem_total = 1;
    uint64 mem_used = 2;
    uint64 cpu_cores = 3;
    double cpu_usage = 4;
    uint64 incoming_bandwidth_speed = 5;
    uint64 outgoing_bandwidth_speed = 6;
    uint64 uptime = 7;
}

// User
message Vmess {
    string id = 1;
}

message Vless {
    string id = 1;
    string flow = 2;
}

message Trojan {
    string password = 1;
}

message Shadowsocks {
    string password = 1;
    string method = 2;
}

message Wireguard {
    string public_key = 1;
    repeated string peer_ips = 2;
}

message Hysteria {
    string auth = 1;
}

message Openvpn {
    // Decimal string of the client's certificate serial number. OpenVPN exposes
    // the peer certificate serial as decimal (tls_serial_0), so this has to
    // match that representation exactly for the node to identify the user.
    string serial = 1;
    // Hex-encoded SHA-256 fingerprint of the client certificate (DER).
    string fingerprint = 2;
}

message Ikev2 {
    // CHAP credentials for the L2TP/PPP layer. The message keeps its ikev2
    // name (and Proxy field 8) from before the drop, because that is the key
    // the panel's stored proxy settings still use.
    string username = 1;
    string password = 2;
}

message Proxy {
    Vmess vmess = 1;
    Vless vless = 2;
    Trojan trojan = 3;
    Shadowsocks shadowsocks = 4;
    Wireguard wireguard = 5;
    Hysteria hysteria = 6;
    Openvpn openvpn = 7;
    Ikev2 ikev2 = 8;
}

message User {
    string email = 1;
    Proxy proxies = 2;
    repeated string inbounds = 3;
    // How many connections this user may hold at once, across every backend and
    // every node. 0 means no limit, which is also what an older panel that does
    // not set the field sends.
    uint32 ip_limit = 4;
}

message Users {
  repeated User users = 1;
}

message UsersChunk {
  repeated User users = 1;
  uint64 index = 2;
  bool last = 3;
}

// Service for node management and connection
service NodeService {
  rpc Start (Backend) returns (BaseInfoResponse) {}
  rpc Stop (Empty) returns (Empty) {}
  rpc GetBaseInfo (Empty) returns (BaseInfoResponse) {}

  rpc GetLogs (Empty) returns (stream Log) {}

  rpc GetSystemStats (Empty) returns (SystemStatsResponse) {}
  rpc GetBackendStats (Empty) returns (BackendStatsResponse) {}

  rpc GetStats (StatRequest) returns (StatResponse) {}
  rpc GetOutboundsLatency (LatencyRequest) returns (LatencyResponse) {}

  rpc GetUserOnlineStats (StatRequest) returns (OnlineStatResponse) {}
  rpc GetUserOnlineIpListStats(StatRequest) returns (StatsOnlineIpListResponse) {}

  rpc SyncUser (stream User) returns (Empty) {}
  rpc SyncUsers (Users) returns (Empty) {}
  rpc SyncUsersChunked (stream UsersChunk) returns (Empty) {}
}
